services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wallet_cash_in_test
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_cash_in_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - wallet_cash_in_test_data:/var/lib/postgresql/data

volumes:
  wallet_cash_in_test_data:
